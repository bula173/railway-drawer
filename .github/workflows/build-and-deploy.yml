name: CI

# Production deploys are done by Cloudflare Workers Builds (configured in the
# Cloudflare dashboard, reads wrangler.jsonc). This workflow only verifies.
on:
  push:
    branches: [ marcin, main ]

  pull_request:
    branches: [ marcin, main ]

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Typecheck, Lint, Test, Build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Type check tests
      run: npm run typecheck:tests

    - name: Lint
      run: npm run lint

    - name: Run tests
      run: npm run test:run

    - name: Build project
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: railway-drawer-build
        path: dist/
        retention-days: 30
