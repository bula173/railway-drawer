name: CI

# Production deploys are done by Cloudflare Workers Builds (configured in the
# Cloudflare dashboard, reads wrangler.jsonc). This workflow only verifies.
on:
  push:
    branches: [ marcin, main ]

  pull_request:
    branches: [ marcin, main ]

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Typecheck, Lint, Test, Build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Type check tests
      run: npm run typecheck:tests

    - name: Lint
      run: npm run lint

    - name: Run tests
      run: npm run test:run

    - name: Build project
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: railway-drawer-build
        path: dist/
        retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    name: Playwright (chromium)
    needs: verify

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: >-
        npx playwright test --project=chromium
        tests/e2e/legacy-smoke.spec.ts tests/e2e/drawio-palette.spec.ts tests/e2e/templates.spec.ts
        tests/e2e/scenarios.spec.ts tests/e2e/style-edit.spec.ts tests/e2e/share.spec.ts tests/e2e/gitlab.spec.ts
        tests/e2e/ertms-data.spec.ts tests/e2e/ertms-routes.spec.ts tests/e2e/railml.spec.ts tests/e2e/scenario-uml-text.spec.ts tests/e2e/theme-contrast.spec.ts
        tests/e2e/remote-persist.spec.ts tests/e2e/scenario-doc.spec.ts tests/e2e/editor-commands.spec.ts tests/e2e/dark-shapes.spec.ts
        tests/e2e/drawio-compat.spec.ts tests/e2e/interaction.spec.ts tests/e2e/hover-arrows.spec.ts tests/e2e/railway-script.spec.ts
        tests/e2e/ux-batch.spec.ts tests/e2e/ux-batch2a.spec.ts tests/e2e/ux-batch2b.spec.ts tests/e2e/move-connect.spec.ts tests/e2e/object-states.spec.ts
        tests/e2e/canvas-scroll.spec.ts tests/e2e/railway-shapes.spec.ts

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14
